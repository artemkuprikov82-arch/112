<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ozon Clone</title>
    <style>
        :root {
            --ozon-red: #ff5c00;
            --ozon-bg: #f0f0f0;
            --white: #ffffff;
            --text: #111;
            --card-bg: #fff;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Arial', sans-serif; }
        body { background: var(--ozon-bg); color: var(--text); }
        
        /* Header */
        header { background: var(--white); padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .logo { font-size: 24px; font-weight: bold; color: var(--ozon-red); text-transform: uppercase; letter-spacing: 1px; }
        .search-bar { flex: 1; max-width: 600px; margin: 0 20px; }
        .search-bar input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 20px; outline: none; }
        .header-actions button { background: none; border: none; cursor: pointer; font-size: 18px; margin-left: 15px; color: var(--text); }
        .cart-count { position: relative; }
        .badge { position: absolute; top: -8px; right: -8px; background: var(--ozon-red); color: white; font-size: 12px; padding: 2px 6px; border-radius: 50%; }

        /* Main */
        main { padding: 20px; max-width: 1200px; margin: 0 auto; }
        h2 { margin-bottom: 20px; }
        
        /* Grid */
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
        .product-card { background: var(--card-bg); padding: 15px; border-radius: 8px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); transition: transform 0.2s; }
        .product-card:hover { transform: translateY(-5px); }
        .product-img { width: 150px; height: 150px; background: #eee; margin: 0 auto 15px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #888; }
        .product-title { font-size: 14px; margin-bottom: 10px; line-height: 1.4; }
        .price { font-size: 18px; font-weight: bold; color: var(--ozon-red); margin-bottom: 15px; }
        .btn-add { width: 100%; padding: 10px; background: var(--ozon-red); color: white; border: none; border-radius: 6px; cursor: pointer; }
        .btn-add:hover { background: #e04500; }

        /* Cart Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 30px; border-radius: 12px; width: 90%; max-width: 500px; }
        .cart-item { display: flex; justify-content: space-between; margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .cart-total { font-size: 20px; font-weight: bold; margin-top: 20px; text-align: right; }
        .btn-checkout { width: 100%; padding: 12px; background: var(--ozon-red); color: white; border: none; border-radius: 6px; margin-top: 15px; font-size: 16px; }
    </style>
</head>
<body>

<header>
    <div class="logo">OZON CLONE</div>
    <div class="search-bar">
        <input type="text" placeholder="Поиск товаров...">
    </div>
    <div class="header-actions">
        <button>Войти</button>
        <button class="cart-count" id="open-cart">🛒
            <span class="badge" id="cart-badge">0</span>
        </button>
    </div>
</header>

<main>
    <h2>Популярные товары</h2>
    <div class="products-grid" id="products-container">
        <!-- Товары будут добавлены через JS -->
    </div>
</main>

<!-- Корзина -->
<div class="modal" id="cart-modal">
    <div class="modal-content">
        <h2>Корзина</h2>
        <div id="cart-items">
            <p style="color:#888;">Корзина пуста</p>
        </div>
        <div class="cart-total">Итого: <span id="cart-total">0</span> ₽</div>
        <button class="btn-checkout">Оформить заказ</button>
        <button onclick="document.getElementById('cart-modal').style.display='none'" style="margin-top:10px; background:none; border:none; cursor:pointer;">Закрыть</button>
    </div>
</div>

<script>
    // Данные товаров (имитация базы данных)
    const products = [
        { id: 1, title: "Беспроводные наушники", price: 2500, img: "🎧" },
        { id: 2, title: "Смартфон Pro", price: 35000, img: "📱" },
        { id: 3, title: "Кофемашина", price: 12000, img: "☕" },
        { id: 4, title: "Фитнес-браслет", price: 3500, img: "⌚" },
        { id: 5, title: "Книга: Путь к успеху", price: 800, img: "📚" },
        { id: 6, title: "Чехол для телефона", price: 500, img: "💼" }
    ];

    const container = document.getElementById('products-container');
    const cart = ;
    const badge = document.getElementById('cart-badge');
    const modal = document.getElementById('cart-modal');
    const cartItemsEl = document.getElementById('cart-items');
    const totalEl = document.getElementById('cart-total');

    // Рендер товаров
    products.forEach(product => {
        const card = document.createElement('div');
        card.className = 'product-card';
        card.innerHTML = `
            <div class="product-img">\${product.img}</div>
            <div class="product-title">\${product.title}</div>
            <div class="price">\${product.price.toLocaleString()} ₽</div>
            <button class="btn-add" onclick="addToCart(\${product.id})">В корзину</button>
        `;
        container.appendChild(card);
    });

    // Логика корзины
    function addToCart(id) {
        const product = products.find(p => p.id === id);
        cart.push(product);
        updateCartUI();
    }

    function updateCartUI() {
        badge.textContent = cart.length;
        cartItemsEl.innerHTML = '';
        let total = 0;

        if (cart.length === 0) {
            cartItemsEl.innerHTML = '<p style="color:#888;">Корзина пуста</p>';
        } else {
            cart.forEach((item, index) => {
                total += item.price;
                const div = document.createElement('div');
                div.className = 'cart-item';
                div.innerHTML = `
                    <span>\${item.title}</span>
                    <span>${item.price.toLocaleString()} ₽ <button onclick="removeFromCart(${index})" style="color:red; border:none; background:none; cursor:pointer;">✕</button></span>
                `;
                cartItemsEl.appendChild(div);
            });
            totalEl.textContent = total.toLocaleString();
        }
    }

    function removeFromCart(index) {
        cart.splice(index, 1);
        updateCartUI();
    }

    // Открытие корзины
    document.getElementById('open-cart').addEventListener('click', () => {
        modal.style.display = 'flex';
    });
</script>

</body>
</html>
